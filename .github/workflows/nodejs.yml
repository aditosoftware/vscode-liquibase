name: Build Project

on:
  pull_request:
  push:
    branches:
      - "main"
  release:
    types: [ created ]

jobs:
  build:
    strategy:
      matrix:
        # No windows runner, because in this extension, we have a lot of tests that need docker in the WSL.
        # Sadly, the setup-wsl (https://github.com/Vampire/setup-wsl) and the current windows runners only support WSL 1.
        # Therefore, we can not install and start a docker container in the WSL.

        # Currently, no macOS runner, because during the setup of docker, this runner hangs: https://github.com/douglascamata/setup-docker-macos-action/issues/37
        os: [ ubuntu-latest ]
        node-version: [ 20.x, 22.x ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up JDK for Liquibase  CLI
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Check Docker Version
        run: docker --version

      - name: Check npm versions
        run: npm -v

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            webview-ui/build
            webview-ui/node-modules
          key: node_modules-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node_modules-${{ matrix.os }}-node-${{ matrix.node-version }}

      - name: Run clean install
        run: npm ci --ignore-scripts

      - name: Run tests on Linux
        run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - name: Run tests on macOS and Windows
        run: npm test
        if: runner.os != 'Linux'

  e2e-tests:
    needs: build
    strategy:
      # let other jobs finish as well, maybe they can finish and there is only an error in one of the jobs
      fail-fast: false
      matrix:
        # No windows runner, because in this extension, we have a lot of tests that need docker in the WSL.
        # Sadly, the setup-wsl (https://github.com/Vampire/setup-wsl) and the current windows runners only support WSL 1.
        # Therefore, we can not install and start a docker container in the WSL.

        # Currently, no macOS runner, because during the setup of docker, this runner hangs: https://github.com/douglascamata/setup-docker-macos-action/issues/37
        node-version: [ 20.x, 22.x ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up JDK for Liquibase  CLI
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Restore cached node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            webview-ui/build
            webview-ui/node-modules
          key: node_modules-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node_modules-${{ matrix.os }}-node-${{ matrix.node-version }}

      - name: run e2e tests
        run: xvfb-run -a npm run test:e2e -- --storage ./out/test-resources/${{ matrix.os }}/${{ matrix.node-version }}
        if: runner.os == 'Linux'

      - name: npm e2e tests
        run: npm run test:e2e -- --storage ./out/test-resources/${{ matrix.os }}/${{ matrix.node-version }}
        if: runner.os != 'Linux'

      - name: "Upload e2e screenshots"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ matrix.os }}-${{ matrix.node-version }}
          path: ./out/test-resources/**/screenshots/**
          retention-days: 5
          if-no-files-found: ignore

  sonar:
    name: Run eslint and sonar scanning
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        # full history and all branch refs are needed, so the sonar scanner can
        # resolve the base branch `main` for the new code period calculation
        # (otherwise it warns: "Could not find ref 'main' in refs/heads, ...")
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Restore cached node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            webview-ui/build
            webview-ui/node-modules
          key: node_modules-ubuntu-latest-node-22.x-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node_modules-ubuntu-latest-node-22.x
      - name: Run ESLint
        run: npm run lint -- --format json --output-file eslint-results.json || true

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # sonar.sources must be set explicitly when sonar.tests is set,
          # otherwise the scanner indexes ONLY the test directories and the
          # eslint report import cannot match any regular source file
          # ("No input file found for ...")
          # sonar.exclusions only applies to main (non-test) files, so the test
          # dirs can be excluded here without affecting the sonar.tests indexing
          # sonar.tests: explicit test classification instead of the path heuristic
          # (only the real test dirs; sbom/sbom-creation.ts is a CI utility script
          # executed by node, not a test, so it stays a regular analyzed source)
          # tsconfigPaths: both TS projects must be listed, otherwise only the
          # root project is analyzed
          args: -Dsonar.projectKey=aditosoftware_vscode-liquibase
            -Dsonar.organization=aditosoftware
            -Dsonar.eslint.reportPaths=eslint-results.json
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*.ttf,**/*.woff,**/*.woff2,**/*.jar,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.mp4,**/*.vsix,src/test/workspace/**,src/test/suite/**,src/test/e2e/**,webview-ui/build/**,out/**,dist/**
            -Dsonar.tests=src/test/suite,src/test/e2e
            -Dsonar.typescript.tsconfigPaths=tsconfig.json,webview-ui/tsconfig.json


  sbom:
    name: Generate merged SBOM
    if: github.event_name == 'release' || (github.ref_name == 'main' && github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies (root)
        run: npm ci --ignore-scripts

      - name: Install deps (webview-ui)
        working-directory: webview-ui
        run: npm ci --ignore-scripts

      - name: Generate SBOM (root)
        run: npm run sbom:createRoot

      - name: Generate SBOM (webview-ui)
        run: npm run sbom:createWebview

      - name: Prepare directory for SBOM JARs
        run: npm run sbom:prepareSbomJarCreation

      - name: Create SBOM for JARs
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: ./out/sbom/
          format: cyclonedx-json
          upload-artifact: false
          output-file: sbom/sbom-jars.json
          config: ./.syft.yaml

      - name: Merge + validate (CycloneDX CLI via Docker)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            cyclonedx/cyclonedx-cli \
            merge --input-files sbom/sbom-root.json sbom/sbom-webview-ui.json sbom/sbom-jars.json --output-file sbom/combined-sbom.json


      - name: Convert combined SBOM to CycloneDX 1.6
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            cyclonedx/cyclonedx-cli \
            convert --input-file sbom/combined-sbom.json --output-file sbom/combined-sbom-1.6.json --output-version v1_6 --output-format json

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@331f980a6eba119842052f447c54b09e4888b4c6
        with:
          server-hostname: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}
          api-key: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          project-name: ${{ github.event.repository.name }}
          project-version: ${{ github.ref_type == 'tag' && github.ref_name || 'current' }}
          # add current tag when building for a branch
          project-tags: designer-extension-pack,${{ github.event.repository.name }}${{ github.ref_type == 'branch' && ',current' || '' }}
          bom-filename: "sbom/combined-sbom-1.6.json"
          auto-create: true
